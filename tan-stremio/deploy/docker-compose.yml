# TAN Stremio proxy on a VPS, with automatic HTTPS via Caddy.
#   1. point a domain's DNS A record at this server
#   2. cp .env.example .env  and fill it in
#   3. docker compose up -d --build
# Then install  https://<DOMAIN>/<TAN_SECRET>/manifest.json  in Stremio.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - tan

  tan:
    build:
      context: ../..
      dockerfile: tan-stremio/deploy/Dockerfile
    restart: unless-stopped
    environment:
      - TAN_UPSTREAM=${TAN_UPSTREAM}
      - TAN_SECRET=${TAN_SECRET}
      - TAN_PROFILE=${TAN_PROFILE:-movie}
    # No published ports: only Caddy talks to it, over the compose network.

volumes:
  caddy_data:
  caddy_config:
