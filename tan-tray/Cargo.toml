[package]
name = "tan-tray"
version = "0.0.6"
edition = "2024"

[[bin]]
name = "tan-tray"
path = "src/main.rs"

[dependencies]
tan-live = { path = "../tan-live" }
tao = "0.30"
tray-icon = "0.19"
arboard = "3"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
