name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
            ffi-file: tan.dll
          - os: macos-latest
            name: macos-arm64
            ffi-file: libtan.dylib
          - os: ubuntu-latest
            name: linux-x86_64
            ffi-file: libtan.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dev headers (audio + tray GUI)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Build CLI, FFI, live tool, and tray app
        shell: bash
        run: |
          cargo build --release -p tan-cli -p tan-ffi -p tan-live -p tan-tray

      - name: Assemble dist folder
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then ext=".exe"; fi
          cp "target/release/tan-cli${ext}" dist/
          cp "target/release/tan-live${ext}" dist/
          cp "target/release/tan-tray${ext}" dist/
          cp "target/release/${{ matrix.ffi-file }}" dist/
          cp README.md ELI5.md LICENSE dist/

      # Windows runners don't ship the `zip` CLI (that's Unix-only); use
      # PowerShell's Compress-Archive there instead so every leg of the
      # matrix can actually produce its artifact.
      - name: Zip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "tan-${{ matrix.name }}.zip"

      - name: Zip (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: cd dist && zip -r "../tan-${{ matrix.name }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: tan-${{ matrix.name }}
          path: tan-${{ matrix.name }}.zip

      # A friendly click-through installer for the tray app (Start Menu entry,
      # optional run-at-sign-in), built with Inno Setup on the Windows runner.
      - name: Build Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DDistDir=$PWD\dist" `
            "/DOutDir=$PWD" `
            packaging\windows\tan-setup.iss

      - name: Upload Windows installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: tan-windows-installer
          path: tan-setup-*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*/*.zip
            artifacts/*/*.exe
          generate_release_notes: true
          # Built and attached, but hidden until you click Publish - so you can
          # download the assets and test on another machine first. Publishing it
          # makes it the "latest" release the Get TAN button and updater serve.
          draft: true
